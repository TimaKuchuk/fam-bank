<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Fit Challenge</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#F3F4FA;--card:#fff;--field:#EEF0F7;--text:#14151C;--muted:#7B8092;--line:rgba(30,32,60,.09);
  --accent:#5A5CF0;--accent2:#9A63FF;--good:#1FAF7B;--warn:#F59E0B;--bad:#EE4B5A;
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
  --shadow:0 8px 28px rgba(40,44,110,.10);--r:22px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme=dark]{
  --bg:#0E1015;--card:#181B23;--field:#232733;--text:#F3F4F8;--muted:#8F95A8;--line:rgba(255,255,255,.09);
  --accent:#7A7CFF;--accent2:#B07BFF;--shadow:0 8px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font:16px/1.4 var(--font);-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom));min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 8px}
.page{animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
h2{font-size:19px;font-weight:750;letter-spacing:-.01em;margin:26px 2px 12px;display:flex;align-items:center;justify-content:space-between}
h2 small{font-size:13px;font-weight:500;color:var(--muted)}
h3{font-size:18px;font-weight:750;margin-bottom:12px}
.muted{color:var(--muted)}.sm{font-size:13.5px}.xs{font-size:12px}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.press{cursor:pointer;transition:transform .15s}.card.press:active{transform:scale(.985)}
.topbar{display:flex;align-items:center;height:40px;margin:0 0 8px -6px}
.back{display:flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;padding:8px 10px;border-radius:12px}
.back:active{background:var(--field)}

/* кнопки */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:18px;background:var(--grad);color:#fff;font-weight:650;font-size:16.5px;margin-top:14px;box-shadow:0 10px 24px rgba(90,92,240,.32);transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.975)}.btn:disabled{opacity:.55;box-shadow:none}
.btn.soft{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);box-shadow:none}
.btn.ghost{background:var(--field);color:var(--text);box-shadow:none}
.btn.sm{min-height:44px;font-size:15px;border-radius:14px;margin-top:10px}
.btn .sp{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn.soft .sp,.btn.ghost .sp{border-color:color-mix(in srgb,var(--accent) 30%,transparent);border-top-color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.iconbtn{width:40px;height:40px;border-radius:14px;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:18px}

/* поля */
label.l{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:16px 2px 7px;letter-spacing:.01em}
.inp{width:100%;background:var(--field);border:2px solid transparent;border-radius:16px;padding:14px 16px;outline:none;transition:border-color .2s,background .2s}
.inp:focus{border-color:var(--accent);background:var(--card)}
textarea.inp{min-height:96px;resize:none;line-height:1.4}
.nf{display:flex;align-items:center;background:var(--field);border-radius:16px;padding:4px;gap:2px;border:2px solid transparent;transition:border-color .2s}
.nf:focus-within{border-color:var(--accent)}
.nf button{width:34px;height:34px;border-radius:10px;background:var(--card);font-size:19px;font-weight:500;color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.nf button:active{transform:scale(.92)}
.nf .mid{flex:1;display:flex;align-items:baseline;justify-content:center;gap:3px;min-width:0;overflow:hidden}
.nf input{width:100%;min-width:0;border:0;background:none;outline:none;text-align:center;font-size:19px;font-weight:700;-moz-appearance:textfield}
.nf input::-webkit-outer-spin-button,.nf input::-webkit-inner-spin-button{-webkit-appearance:none}
.nf .u{font-size:12px;color:var(--muted);font-weight:600;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:flex;background:var(--field);border-radius:16px;padding:4px;gap:2px}
.seg button{flex:1;padding:11px 6px;border-radius:12px;font-weight:600;font-size:14.5px;color:var(--muted);transition:all .2s;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.optc{background:var(--field);border:2px solid transparent;border-radius:18px;padding:12px;text-align:left;transition:all .2s;display:block;width:100%}
.optc .ic{font-size:24px;display:block;margin-bottom:4px}.optc b{display:block;font-size:15px}.optc span{font-size:12px;color:var(--muted)}
.optc.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.picker{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--field);border-radius:16px;padding:14px 16px;font-weight:600;text-align:left}
.picker.sm{padding:11px 12px;font-size:14.5px;border-radius:14px}.picker.sm .v{gap:0;min-width:0}.picker.sm .txt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.picker.sm .ch{font-size:16px;margin-left:4px}
.picker .v{display:flex;align-items:center;gap:10px}.picker .ch{color:var(--muted);font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:99px;background:var(--field);font-size:13.5px;font-weight:600;color:var(--text)}
.chip:active{transform:scale(.96)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.acc{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.pill.gray{background:var(--field);color:var(--muted)}
.switch{width:52px;height:32px;border-radius:99px;background:var(--field);position:relative;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,.9,.3,1.2)}
.switch.on{background:var(--good)}.switch.on::after{transform:translateX(20px)}

/* аватары */
.av{width:38px;height:38px;border-radius:50%;color:#fff;font-weight:750;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.avs{display:flex}.avs .av{width:30px;height:30px;font-size:12px;border:2px solid #fff;margin-left:-9px}.avs .av:first-child{margin-left:0}

/* hero */
.hero{background:var(--grad);color:#fff;border-radius:28px;padding:20px 20px 18px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(90,92,240,.34);margin-bottom:14px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{width:190px;height:190px;right:-60px;top:-70px}.hero::after{width:110px;height:110px;right:50px;bottom:-60px}
.hero h1{position:relative;font-size:26px}
.hero .meta{position:relative;opacity:.88;font-size:14px;margin-top:4px}
.hero .pills{position:relative;display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.hero .pill{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(6px)}
.tbar{position:relative;height:6px;border-radius:9px;background:rgba(255,255,255,.25);margin-top:16px;overflow:hidden}
.tbar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.hero .foot{position:relative;display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.hero .glass{background:rgba(255,255,255,.22);color:#fff;border-radius:14px;padding:9px 14px;font-weight:650;font-size:14px;backdrop-filter:blur(8px)}

/* сегодня */
.today .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.today .head b{font-size:17px}
.ringwrap{display:flex;gap:16px;align-items:center}
.ringbox{position:relative;width:128px;height:128px;flex:none}
.ringbox svg{display:block}.rg{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.ringbox .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .ctr b{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ringbox .ctr span{font-size:12px;color:var(--muted);margin-top:3px}
.macros{flex:1;display:grid;gap:11px}
.mac .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px}.mac .t span{color:var(--muted)}
.bar{height:8px;border-radius:9px;background:var(--field);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.verdict{margin-top:16px;padding:13px 14px;border-radius:16px;font-size:14.5px;line-height:1.42;background:color-mix(in srgb,var(--accent) 9%,var(--card));border:1px solid color-mix(in srgb,var(--accent) 16%,transparent)}
.verdict.ok{background:color-mix(in srgb,var(--good) 11%,var(--card));border-color:color-mix(in srgb,var(--good) 22%,transparent)}
.verdict.over{background:color-mix(in srgb,var(--bad) 10%,var(--card));border-color:color-mix(in srgb,var(--bad) 22%,transparent)}
.wrow{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line)}
.food{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.food:first-child{border-top:0}
.food .em{width:40px;height:40px;border-radius:14px;background:var(--field);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.food .x{width:32px;height:32px;border-radius:10px;color:var(--muted);font-size:16px}.food .x:active{background:var(--field)}

/* гонка */
.race{padding:14px 14px 10px}
.lane{padding:10px 0 12px;border-top:1px solid var(--line)}.lane:first-of-type{border-top:0;padding-top:2px}
.lane .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lane .rk{width:26px;text-align:center;font-size:18px;flex:none;font-weight:700;color:var(--muted)}
.lane .nm{font-weight:700;flex:1;min-width:0}.lane .pc{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.lane.me .nm::after{content:" · ты";color:var(--accent);font-weight:600}
.lt{position:relative;height:38px;margin:0 2px}
.lt .bar0{position:absolute;left:19px;right:19px;top:12px;height:14px;border-radius:99px;background:var(--field)}
.lt .fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--p,0)*100%);border-radius:99px;background:var(--grad);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.lt .dot{position:absolute;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;border-radius:50%;background:var(--muted);opacity:.45}
.lt .plan{position:absolute;top:-4px;width:0;height:0;margin-left:-5px;border-left:5px solid transparent;border-right:5px solid transparent;border-top:7px solid var(--muted);opacity:.7}
.lt .runner{position:absolute;top:0;left:calc(19px + (100% - 38px)*var(--p,0));transform:translateX(-19px);width:38px;height:38px;transition:left 1.1s cubic-bezier(.2,.8,.2,1)}
.lt .runner .av{border:3px solid var(--card);box-shadow:0 4px 12px rgba(0,0,0,.22)}
.lane.me .runner .av{outline:2.5px solid var(--accent);outline-offset:1px}
.lt .flag{position:absolute;right:-4px;top:-6px;font-size:18px}
.lane .sub{display:flex;align-items:center;gap:8px;margin-top:6px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);padding:4px 4px 2px}
.legend i{display:inline-block;width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:6px solid var(--muted);margin-right:5px;vertical-align:1px}

/* карточки списка */
.chcard{display:flex;align-items:center;gap:14px}
.chcard .ico{width:50px;height:50px;border-radius:17px;background:color-mix(in srgb,var(--accent) 12%,var(--card));display:flex;align-items:center;justify-content:center;font-size:25px;flex:none}
.mini{position:relative;width:46px;height:46px;flex:none}.mini span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.empty{text-align:center;padding:34px 20px}.empty .big{font-size:52px;margin-bottom:8px}
.tile{border-radius:20px;padding:14px;color:#fff;position:relative;overflow:hidden}
.tile b{font-size:24px;font-weight:800;display:block;letter-spacing:-.02em}.tile span{font-size:12.5px;opacity:.9}
.tile.t1{background:linear-gradient(135deg,#5A5CF0,#7F7BFF)}.tile.t2{background:linear-gradient(135deg,#F2705B,#F59E4B)}.tile.t3{background:linear-gradient(135deg,#1FAF7B,#3CCB95)}
.tile .em{position:absolute;right:8px;top:4px;font-size:30px;opacity:.35}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:50;opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.ov.show{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.ov.show .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 16px;background:color-mix(in srgb,var(--muted) 40%,transparent)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 12px;border-radius:16px}
.opt:active{background:var(--field)}.opt .ico{font-size:22px;width:30px;text-align:center}
.opt .t{flex:1}.opt .t b{display:block;font-size:16px}.opt .t small{color:var(--muted);font-size:13px}
.opt .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}.opt.on .chk{border:7px solid var(--accent)}
.cal .nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal .nav b{font-size:17px}.cal .nav button{width:40px;height:40px;border-radius:13px;background:var(--field);font-size:18px}
.cal .dow,.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow span{font-size:12px;color:var(--muted);font-weight:600;padding:6px 0}
.cal .d{aspect-ratio:1;border-radius:14px;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center}
.cal .ty{padding:8px 12px;border-radius:12px;background:var(--field);cursor:pointer}
.years{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:52vh;overflow-y:auto;padding:2px}
.years button{padding:11px 0;border-radius:12px;background:var(--field);font-weight:600;font-size:15px}
.years button.on{background:var(--grad);color:#fff}
.cal .d:disabled{opacity:.28;cursor:default}
.cal .d.today{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--accent) 50%,transparent)}
.cal .d.sel{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(90,92,240,.35)}
.hours{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hours button{padding:13px 0;border-radius:14px;background:var(--field);font-weight:700}.hours button.on{background:var(--grad);color:#fff}
.src a{color:var(--accent);text-decoration:none;font-size:12.5px;font-weight:600}
.aiitem{padding:12px 0;border-top:1px solid var(--line)}.aiitem:first-child{border-top:0}
.tot{background:var(--field);border-radius:18px;padding:12px;margin-top:10px}

/* skeleton, toast, tabs */
.skel{border-radius:var(--r);background:linear-gradient(90deg,var(--card) 25%,color-mix(in srgb,var(--field) 70%,var(--card)) 50%,var(--card) 75%);background-size:200% 100%;animation:sh 1.3s infinite linear;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,16px);max-width:min(92vw,440px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:16px;font-size:14.5px;font-weight:550;z-index:99;opacity:0;transition:all .3s;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
#tabs{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:6px;border-radius:26px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 34px rgba(30,32,80,.22);z-index:20}
#tabs button{display:flex;align-items:center;gap:8px;padding:11px 20px;border-radius:20px;font-weight:650;font-size:14.5px;color:var(--muted);transition:all .25s}
#tabs button.on{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(90,92,240,.35)}
.err{background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad);padding:14px;border-radius:16px;margin:14px 0;font-size:14.5px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="tabs">
  <button id="tab-home" data-act="tab" data-tab="home"><span>🏆</span>Челленджи</button>
  <button id="tab-profile" data-act="tab" data-tab="profile"><span>👤</span>Профиль</button>
</nav>
<div id="toast" class="toast"></div>

<script>
/* ═════════ НАСТРОЙКИ ═════════ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzPuJf8E1qgz3MaLTJ3bt8P3N9-wwRpYobNnOconT21ptcMpxAW1mApSWaSy7p7ebXn/exec';
const BOT_APP_LINK = 'https://t.me/YOUR_BOT/app';   // ссылка на Mini App: t.me/<бот>/<short_name>

/* ═════════ БАЗА ═════════ */
const tg = (window.Telegram && window.Telegram.WebApp) || { initData:'', initDataUnsafe:{}, ready(){}, expand(){}, BackButton:{show(){},hide(){},onClick(){}}, HapticFeedback:{impactOccurred(){},notificationOccurred(){}}, onEvent(){} };
try { tg.ready(); tg.expand(); } catch(e){}
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hap = (k='light') => { try { tg.HapticFeedback.impactOccurred(k); } catch(e){} };
const hapOk = (k='success') => { try { tg.HapticFeedback.notificationOccurred(k); } catch(e){} };

const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DOW = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const GT = { lose:{t:'Похудеть',i:'⚖️'}, gain:{t:'Набрать массу',i:'💪'}, nutrition:{t:'Питание по КБЖУ',i:'🥗'} };
const DIET = { cut:{t:'Дефицит калорий',d:'−20% от расхода',i:'🔥'}, maintain:{t:'Поддержание',d:'калории = расход',i:'⚖️'}, bulk:{t:'Профицит калорий',d:'+10% к расходу',i:'💪'} };
const ACTV = { low:{i:'🛋️',t:'Минимум',d:'сидячий образ жизни'}, light:{i:'🚶',t:'Лёгкая',d:'1–3 тренировки/нед'}, medium:{i:'🏃',t:'Средняя',d:'3–5 тренировок/нед'}, high:{i:'🏋️',t:'Высокая',d:'6–7 тренировок/нед'} };
const MEAL = { breakfast:{i:'🍳',t:'Завтрак'}, lunch:{i:'🍲',t:'Обед'}, dinner:{i:'🍝',t:'Ужин'}, snack:{i:'🍎',t:'Перекус'} };
const AVC = ['#EF5B5B','#F59E0B','#1FAF7B','#3B82F6','#8B5CF6','#EC4899','#14B8A6','#F97316'];
const col = s => AVC[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0) % AVC.length];
const ini = n => (String(n||'?').trim()[0]||'?').toUpperCase();
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const todayStr = () => ymd(new Date());
const addD = (s,n) => { const d = parseYmd(s); d.setDate(d.getDate()+n); return ymd(d); };
const diffD = (a,b) => Math.round((parseYmd(b)-parseYmd(a))/864e5);
const ageOf = b => { const [y,m,d] = b.split('-').map(Number), t = new Date(); let a = t.getFullYear()-y; if (t.getMonth()+1 < m || (t.getMonth()+1 === m && t.getDate() < d)) a--; return a; };
const birthTxt = b => b ? b.split('-').reverse().join('.')+' · '+ageOf(b) : 'Выбрать';
const fmtLong = s => { const [y,m,d] = s.split('-').map(Number); return d+' '+MONTHS[m-1]+' '+y; };
const fmtShort = s => { const [,m,d] = s.split('-').map(Number); return d+' '+MONTHS[m-1].slice(0,3).replace(/^мая.*/,'мая'); };
const plural = (n,a,b,c) => { const m = Math.abs(n)%100, k = m%10; return (m>10&&m<20)?c:k===1?a:(k>=2&&k<=4)?b:c; };
const pct = x => Math.round((x||0)*100);

/* ═════════ КЭШ И API ═════════ */
const UID = (tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) || 0;
const cache = {
  get(k){ try { return JSON.parse(localStorage.getItem('fc2:'+UID+':'+k)); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem('fc2:'+UID+':'+k, JSON.stringify(v)); } catch(e){} }
};
async function api(action, data = {}) {
  if (!tg.initData) throw new Error('Открой приложение через Telegram');
  const body = JSON.stringify({ action, initData: tg.initData, ...data });
  let lastErr;
  for (let i = 0; i < 2; i++) {
    try {
      const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), 45000);
      const r = await fetch(API_URL, { method:'POST', body, signal: ctl.signal });
      clearTimeout(to);
      const j = await r.json();
      if (!j.ok) { const e = new Error(j.error); e.server = true; throw e; }
      return j.data;
    } catch (e) { lastErr = e; if (e.server) throw e; await new Promise(r => setTimeout(r, 600)); }
  }
  throw new Error('Нет связи с сервером. Проверь интернет и попробуй ещё раз');
}

/* ═════════ СОСТОЯНИЕ И РОУТЕР ═════════ */
const S = { me: null, list: null, bootP: null };
let NAV = 0, CUR = { v:'home' }, HIST = [];
const sheets = [];

function themeMode(){ try { return localStorage.getItem('fc2:theme') || 'auto'; } catch(e){ return 'auto'; } }
function theme(){
  const m = themeMode(), h = new Date().getHours();
  const dark = m === 'dark' ? true : m === 'light' ? false : (h >= 20 || h < 7); // авто: тёмная с 20:00 до 7:00 по местному времени
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  try { const bg = dark ? '#0E1015' : '#F3F4FA'; tg.setHeaderColor(bg); tg.setBackgroundColor(bg); } catch(e){}
}
theme(); setInterval(theme, 60000); document.addEventListener('visibilitychange', theme);

function toast(msg, ms = 3200){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms);
}
function setTab(name){ $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === name)); }
function backBtn(show){ try { show ? tg.BackButton.show() : tg.BackButton.hide(); } catch(e){} }
try { tg.BackButton.onClick(() => { if (sheets.length) closeSheet(); else back(); }); } catch(e){}

function page(html, after){
  const el = $('#app'); el.innerHTML = '<div class="page">'+html+'</div>';
  window.scrollTo(0,0);
  if (after) requestAnimationFrame(() => requestAnimationFrame(after));
}
function topbar(){ return '<div class="topbar"><button class="back" data-act="back">‹ Назад</button></div>'; }
function skel(...h){ return h.map(x => `<div class="skel" style="height:${x}px"></div>`).join(''); }

function chrome(tab, v){ backBtn(!tab); setTab(tab ? v : ''); $('#tabs').style.display = tab ? 'flex' : 'none'; }
function go(v, p = {}, opts = {}){
  NAV++;
  const tab = opts.tab !== undefined ? !!opts.tab : (opts.replace ? !!CUR.tab : false);
  if (!tab && !opts.replace && CUR && CUR.v) HIST.push(CUR);
  if (opts.tab) HIST = [];
  CUR = { v, p, tab };
  chrome(tab, v);
  VIEWS[v](p, NAV);
}
function back(){
  const prev = HIST.pop(); if (!prev) return go('home', {}, { tab:true });
  NAV++; CUR = prev; chrome(!!prev.tab, prev.v); VIEWS[prev.v](prev.p, NAV);
}
const live = n => n === NAV;
const typing = () => { const a = document.activeElement; return a && /INPUT|TEXTAREA/.test(a.tagName) && $('#app').contains(a); };

/** Мгновенный показ из кэша + фоновое обновление */
async function swr(key, action, params, nav, render, skeleton){
  const cached = cache.get(key);
  if (cached) render(cached); else if (skeleton) page(skeleton);
  try {
    const fresh = await api(action, params);
    const changed = JSON.stringify(fresh) !== JSON.stringify(cached);
    if (changed) cache.set(key, fresh);
    if (live(nav) && (changed || !cached) && !(cached && typing())) render(fresh);
    return fresh;
  } catch (e) {
    if (!live(nav)) return null;
    if (!cached) page(topbar()+`<div class="err">${esc(e.message)}</div><button class="btn soft" data-act="reload">Повторить</button>`);
    else toast(e.message);
    return null;
  }
}

/* ═════════ UI-КОМПОНЕНТЫ ═════════ */
function openSheet(html, opts = {}){
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = '<div class="sheet"><div class="grab"></div>'+html+'</div>';
  document.body.appendChild(ov);
  const s = { el: ov.firstChild, ov, onDismiss: opts.onDismiss, done:false };
  s.close = (silent) => { if (s.done) return; s.done = true; ov.classList.remove('show'); setTimeout(() => ov.remove(), 300); const i = sheets.indexOf(s); if (i>=0) sheets.splice(i,1); if (!silent && s.onDismiss) s.onDismiss(); if (!sheets.length) backBtn(!CUR.tab); };
  ov.addEventListener('click', e => { if (e.target === ov) s.close(); });
  sheets.push(s); backBtn(true);
  requestAnimationFrame(() => ov.classList.add('show'));
  return s;
}
function closeSheet(){ const s = sheets[sheets.length-1]; if (s) s.close(); }

function pickOption({ title, options, value }){
  return new Promise(res => {
    const s = openSheet(`<h3>${esc(title)}</h3>` + options.map(o => `<button class="opt ${String(o.v)===String(value)?'on':''}" data-v="${esc(o.v)}"><span class="ico">${o.i||''}</span><span class="t"><b>${esc(o.t)}</b>${o.d?`<small>${esc(o.d)}</small>`:''}</span><i class="chk"></i></button>`).join(''), { onDismiss: () => res(undefined) });
    $$('.opt', s.el).forEach(b => b.onclick = () => { hap(); s.close(true); res(b.dataset.v); });
  });
}
function pickHour(value){
  return new Promise(res => {
    const hrs = []; for (let h = 5; h <= 23; h++) hrs.push(h);
    const s = openSheet(`<h3>Во сколько напоминать?</h3><div class="hours">${hrs.map(h => `<button data-h="${h}" class="${h===value?'on':''}">${pad(h)}:00</button>`).join('')}</div>`, { onDismiss: () => res(undefined) });
    $$('button', s.el).forEach(b => b.onclick = () => { hap(); s.close(true); res(Number(b.dataset.h)); });
  });
}
function pickDate({ title, value, min, max, years }){
  return new Promise(res => {
    let cur = parseYmd(value || todayStr()); cur.setDate(1);
    const s = openSheet('<div class="cal"></div>', { onDismiss: () => res(undefined) });
    const root = $('.cal', s.el), tdy = todayStr();
    function draw(){
      const y = cur.getFullYear(), m = cur.getMonth();
      const first = (new Date(y,m,1).getDay()+6)%7, n = new Date(y,m+1,0).getDate();
      let cells = ''; for (let i=0;i<first;i++) cells += '<span></span>';
      for (let d=1; d<=n; d++){
        const ds = y+'-'+pad(m+1)+'-'+pad(d), dis = (min && ds<min) || (max && ds>max);
        cells += `<button class="d ${ds===tdy?'today':''} ${ds===value?'sel':''}" data-d="${ds}" ${dis?'disabled':''}>${d}</button>`;
      }
      root.innerHTML = `<h3>${esc(title||'Выбери дату')}</h3><div class="nav"><button data-n="-1">‹</button><b ${years?'class="ty" data-ty="1"':''}>${MONTHS_NOM[m]} ${y}${years?' ▾':''}</b><button data-n="1">›</button></div>
        <div class="dow">${DOW.map(x=>`<span>${x}</span>`).join('')}</div><div class="days">${cells}</div>`;
      $$('[data-n]', root).forEach(b => b.onclick = () => { hap(); cur.setMonth(cur.getMonth()+Number(b.dataset.n)); draw(); });
      const ty = $('[data-ty]', root); if (ty) ty.onclick = () => { hap(); drawYears(); };
      $$('.d', root).forEach(b => b.onclick = () => { hap(); s.close(true); res(b.dataset.d); });
    }
    function drawYears(){
      const y1 = max ? Number(max.slice(0,4)) : new Date().getFullYear()+1, y0 = min ? Number(min.slice(0,4)) : y1-100;
      let ys = ''; for (let y = y1; y >= y0; y--) ys += `<button class="${y===cur.getFullYear()?'on':''}" data-y="${y}">${y}</button>`;
      root.innerHTML = `<h3>Выбери год</h3><div class="years">${ys}</div>`;
      $$('[data-y]', root).forEach(b => b.onclick = () => { hap(); cur.setFullYear(Number(b.dataset.y)); draw(); });
      const on = $('.years .on', root); if (on) on.scrollIntoView({ block:'center' });
    }
    draw();
  });
}

function numField(id, { value='', min=0, max=999, step=1, unit='', dec=0 } = {}){
  return `<div class="nf" data-min="${min}" data-max="${max}" data-step="${step}" data-dec="${dec}"><button type="button" data-act="nf" data-d="-1">−</button><div class="mid"><input id="${id}" inputmode="${dec?'decimal':'numeric'}" value="${esc(value)}" autocomplete="off"><span class="u">${esc(unit)}</span></div><button type="button" data-act="nf" data-d="1">+</button></div>`;
}
function seg(id, options, value){
  return `<div class="seg" id="${id}" data-value="${esc(value)}">${options.map(o => `<button type="button" data-act="seg" data-v="${esc(o.v)}" class="${String(o.v)===String(value)?'on':''}">${o.l}</button>`).join('')}</div>`;
}
const segVal = id => $('#'+id).dataset.value;
const numVal = id => { const v = $('#'+id).value.replace(',', '.'); return v === '' ? '' : Number(v); };
function btnBusy(b, on){ if (!b) return; if (on){ b.dataset.h = b.innerHTML; b.disabled = true; b.innerHTML = '<span class="sp"></span>'; } else { b.disabled = false; if (b.dataset.h) b.innerHTML = b.dataset.h; } }
async function withBusy(b, fn){ btnBusy(b,true); try { return await fn(); } catch(e){ toast(e.message); hapOk('error'); } finally { btnBusy(b,false); } }

function ring(p, size, stroke, color){
  const r = (size-stroke)/2, c = 2*Math.PI*r, d = c*Math.min(1, Math.max(0, p));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--field)" stroke-width="${stroke}"/><circle class="rg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})" style="stroke:${color};stroke-dasharray:0 ${c}" data-d="${d} ${c}"/></svg>`;
}
function animate(root = document){
  $$('.rg[data-d]', root).forEach(e => e.style.strokeDasharray = e.dataset.d);
  $$('[data-p]', root).forEach(e => e.style.setProperty('--p', e.dataset.p));
  $$('[data-w]', root).forEach(e => e.style.width = e.dataset.w);
}
const STAT = { empty:{c:'var(--muted)',t:'Пока пусто',k:'gray'}, under:{c:'var(--accent)',t:'Недобор',k:'acc'}, ok:{c:'var(--good)',t:'В норме',k:'ok'}, over:{c:'var(--bad)',t:'Перебор',k:'bad'} };

const VIEWS = {};

/* ——— Главная ——— */
function chCard(c){
  const g = c.goal_type && GT[c.goal_type] ? GT[c.goal_type].i : '🎯';
  let st = c.finished ? '<span class="pill gray">Завершён</span>' : c.notStarted ? `<span class="pill acc">Старт ${fmtShort(c.start)}</span>` : !c.joined ? '<span class="pill gray">Не участвую</span>' : c.my && c.my.pending ? '<span class="pill warn">Нужна цель</span>' : c.my && c.my.onTrack ? '<span class="pill ok">В графике</span>' : '<span class="pill warn">Есть что догнать</span>';
  const p = c.my && !c.my.pending ? c.my.progress : null;
  return `<div class="card press chcard" data-act="open" data-id="${esc(c.id)}"><div class="ico">${g}</div>
    <div class="grow"><div class="ell" style="font-weight:700;font-size:16.5px">${esc(c.name)}</div>
    <div class="muted sm ell">${fmtShort(c.start)} – ${fmtShort(c.end)} · ${c.count} ${plural(c.count,'участник','участника','участников')}</div><div style="margin-top:7px">${st}</div></div>
    ${p !== null ? `<div class="mini">${ring(p,46,5,'var(--accent)')}<span>${pct(p)}%</span></div>` : ''}</div>`;
}
function renderHome(boot){
  const list = boot.challenges || [], name = boot.me && boot.me.name;
  page(`<div class="row between" style="margin:6px 2px 16px"><div><div class="muted sm">${name?'Привет, '+esc(name)+' 👋':'Привет 👋'}</div><h1>Челленджи</h1></div>
    <button class="iconbtn" data-act="new-ch" style="width:46px;height:46px;font-size:24px;background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(90,92,240,.35)">＋</button></div>`
    + (list.length ? list.map(chCard).join('') : `<div class="card empty"><div class="big">🏁</div><b style="font-size:18px">Пока нет челленджей</b><p class="muted" style="margin:6px 0 4px">Создай свой и отправь ссылку друзьям — или открой приложение по приглашению.</p></div>`)
    + `<button class="btn" data-act="new-ch">＋ Создать челлендж</button>`, () => animate());
}
VIEWS.home = async (p, nav) => {
  const cached = cache.get('boot');
  if (cached) { S.me = S.me || cached.me; renderHome(cached); } else page(skel(60,96,96,96));
  try {
    const fresh = await boot(true);
    if (live(nav) && (JSON.stringify(fresh) !== JSON.stringify(cached)) && !(cached && typing())) renderHome(fresh);
    prefetch(fresh.challenges);
  } catch (e) { if (live(nav)) { if (!cached) page(`<div class="err">${esc(e.message)}</div><button class="btn soft" data-act="reload">Повторить</button>`); else toast(e.message); } }
};
function boot(force){
  if (S.bootP && !force) return S.bootP;
  S.bootP = api('bootstrap').then(d => { cache.set('boot', d); S.me = d.me; S.list = d.challenges; return d; });
  S.bootP.catch(() => { S.bootP = null; });
  return S.bootP;
}
function prefetch(list){
  (list || []).filter(c => c.joined).slice(0,3).forEach((c,i) => setTimeout(() => api('getChallenge', { id:c.id }).then(d => cache.set('ch:'+c.id, d)).catch(()=>{}), 800 + i*900));
}

function updLen(){ const a = $('#c-start').dataset.v, b = $('#c-end').dataset.v, n = diffD(a,b)+1; $('#c-len').textContent = n > 0 ? 'Длительность: '+n+' '+plural(n,'день','дня','дней') : 'Финиш раньше старта'; }

/* ——— Челлендж ——— */
function lane(m, i){
  const rk = ['🥇','🥈','🥉'][i] || (i+1);
  const st = m.onTrack ? '<span class="pill ok">В графике</span>' : '<span class="pill warn">Отстаёт</span>';
  return `<div class="lane ${m.isMe?'me':''}"><div class="top"><div class="rk">${rk}</div><div class="nm ell">${esc(m.name)}</div><div class="pc">${pct(m.progress)}%</div></div>
    <div class="lt" data-p="${m.progress}" style="--p:0"><div class="bar0"><div class="fill"></div>${[.25,.5,.75].map(x=>`<i class="dot" style="left:${x*100}%"></i>`).join('')}<i class="plan" style="left:${m.expected*100}%"></i></div>
    <div class="runner"><div class="av" style="background:${col(m.user_id)}">${esc(ini(m.name))}</div></div><span class="flag">🏁</span></div>
    <div class="sub"><span class="muted xs">${GT[m.goal_type] ? GT[m.goal_type].i+' '+GT[m.goal_type].t : ''}</span>${st}${m.loggedToday?'<span class="pill gray">✓ сегодня</span>':''}</div></div>`;
}
function todayCard(d){
  const c = d.challenge, my = d.my, day = d.day;
  if (c.notStarted) return `<div class="card"><b>Старт ${fmtLong(c.start)}</b><p class="muted sm" style="margin-top:4px">Твоя цель: ${GT[my.goal_type].i} ${GT[my.goal_type].t}. План на день: ${my.kcal} ккал (Б ${my.protein} / Ж ${my.fat} / У ${my.carbs}).</p></div>`;
  if (!day) return '';
  const S1 = STAT[day.status], kc = my.kcal ? day.eaten.kcal/my.kcal : 0;
  const macro = (n, e, t, color) => `<div class="mac"><div class="t"><b>${n}</b><span>${e} / ${t} г</span></div><div class="bar"><i data-w="${Math.min(100, t ? e/t*100 : 0)}%" style="width:0;background:${color}"></i></div></div>`;
  const food = day.entries.length ? day.entries.map(e => `<div class="food"><div class="em">${(MEAL[e.meal]||MEAL.snack).i}</div><div class="grow"><div class="ell" style="font-weight:600">${esc(e.text || (MEAL[e.meal]||MEAL.snack).t)}</div><div class="muted xs">${e.kcal} ккал · Б ${e.protein} · Ж ${e.fat} · У ${e.carbs}</div></div>${c.finished?'':`<button class="x" data-act="del-food" data-fid="${esc(e.id)}">✕</button>`}</div>`).join('') : '<div class="muted sm" style="padding:6px 2px">Пока нет записей. Опиши, что ел, — ИИ найдёт КБЖУ.</div>';
  let weight = '';
  if (day.weight && !c.finished) {
    const w = day.weight;
    weight = `<div class="wrow"><div class="row between"><b>⚖️ Вес сегодня</b><span class="muted sm">план: ${w.planned} кг</span></div>
      <div class="row" style="margin-top:10px;gap:10px"><div class="grow">${numField('w-in',{value:w.today ?? w.actual ?? my.current_weight, min:30, max:300, step:0.1, unit:'кг', dec:1})}</div><button class="btn sm" data-act="save-weight" style="width:auto;margin:0;padding:0 18px">${w.today!=null?'Обновить':'Записать'}</button></div></div>`;
  }
  return `<div class="card today"><div class="head"><b>Сегодня · ${fmtShort(day.date)}</b><span class="pill ${S1.k}">${S1.t}</span></div>
    <div class="ringwrap"><div class="ringbox">${ring(kc,128,13,S1.c)}<div class="ctr"><b>${day.eaten.kcal}</b><span>из ${my.kcal} ккал</span></div></div>

let prevT; function goalPreview(){

    const G = window._goal; if (!G) return;

/* ═════════ ДЕЙСТВИЯ ═════════ */
const ACT = {
  tab: el => go(el.dataset.tab, {}, { tab:true }),
  back: () => back(),
  reload: () => go(CUR.v, CUR.p, { replace:true }),
  open: el => go('challenge', { id:el.dataset.id }),
  'new-ch': () => go('create'),

  nf(el){
    const box = el.closest('.nf'), inp = $('input', box), step = Number(box.dataset.step), dec = Number(box.dataset.dec), min = Number(box.dataset.min), max = Number(box.dataset.max);
    let v = parseFloat(String(inp.value).replace(',','.')); if (isNaN(v)) v = (min+max)/2 > 1000 ? 0 : min;
    v = Math.min(max, Math.max(min, v + Number(el.dataset.d)*step)); inp.value = dec ? v.toFixed(dec).replace(/\.0$/,'') : Math.round(v); hap();
    if (inp.id === 'g-w') goalPreview();
  },
  seg(el){
    const box = el.parentElement; $$('button', box).forEach(b => b.classList.toggle('on', b === el)); box.dataset.value = el.dataset.v; hap();
    if (box.id === 'p-theme') { try { localStorage.setItem('fc2:theme', el.dataset.v); } catch(e){} theme(); return; }
    if (box.id === 'g-type') {
      const t = el.dataset.v, n = t === 'nutrition'; $('#g-tw').style.display = n ? 'none' : ''; $('#g-dt').style.display = n ? '' : 'none'; window._goal.type = t;
      if (!n) { // подставляем разумный целевой вес, если поле пустое или направление не то
        const me = S.me || (cache.get('boot')||{}).me, w = me ? Number(me.weight) : 70, cur = numVal('g-w');
        if (cur === '' || isNaN(cur) || (t === 'lose' && cur >= w) || (t === 'gain' && cur <= w)) $('#g-w').value = t === 'lose' ? Math.round((w-2)*2)/2 : Math.round((w+1)*2)/2;
      }
      goalPreview();
    }
  },
  act(el){ const box = el.parentElement; $$('.optc', box).forEach(b => b.classList.toggle('on', b === el)); box.dataset.value = el.dataset.v; hap(); },

  async 'pick-birth'(el){
    const t = todayStr(), y = Number(t.slice(0,4));
    const v = await pickDate({ title:'Дата рождения', value: el.dataset.v || (y-25)+'-06-15', min:(y-100)+'-01-01', max:(y-10)+t.slice(4), years:true });
    if (!v) return; el.dataset.v = v; $('.txt', el).textContent = birthTxt(v); hap();
  },
  async 'pick-sex'(el){
    const v = await pickOption({ title:'Пол', value:el.dataset.v, options:[{v:'m',t:'Мужской',i:'👨'},{v:'f',t:'Женский',i:'👩'}] });
    if (!v) return; el.dataset.v = v; $('.txt', el).textContent = v === 'f' ? 'Женский' : 'Мужской';
  },
  async 'pick-date'(el){
    const w = el.dataset.which, v = await pickDate({ title: w === 'start' ? 'Старт челленджа' : 'Финиш челленджа', value: el.dataset.v, min: w === 'end' ? $('#c-start').dataset.v : undefined });
    if (!v) return; el.dataset.v = v; $('.txt', el).textContent = fmtLong(v);
    if (w === 'start' && $('#c-end').dataset.v < v) { const e = addD(v, 29); $('#c-end').dataset.v = e; $('.txt', $('#c-end')).textContent = fmtLong(e); }
    updLen();
  },
  preset(el){ const s = $('#c-start').dataset.v, e = addD(s, Number(el.dataset.n)-1); $('#c-end').dataset.v = e; $('.txt', $('#c-end')).textContent = fmtLong(e); updLen(); hap(); },
  'create-ch'(el){ withBusy(el, async () => {
    const r = await api('createChallenge', { name:$('#c-name').value, description:$('#c-desc').value, start:$('#c-start').dataset.v, end:$('#c-end').dataset.v });
    hapOk(); S.bootP = null; HIST.pop(); go('challenge', { id:r.id }, { replace:true });
  }); },

  join(el){ withBusy(el, async () => {
    const d = await boot(); if (!d.me.complete) { toast('Сначала заполни профиль, по нему ИИ посчитает цель'); return go('profile', { backTo:CUR.p.id }); }
    await api('join', { id:CUR.p.id }); cache.set('ch:'+CUR.p.id, null); S.bootP = null; hapOk(); go('goal', { id:CUR.p.id }, { replace:true });
  }); },
  share(el){
    const id = CUR.p.id;
    const copy = link => {
      let ok = false;
      try { const ta = document.createElement('textarea'); ta.value = link; ta.setAttribute('readonly',''); ta.style.cssText = 'position:fixed;opacity:0;top:0'; document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, 9999); ok = document.execCommand('copy'); ta.remove(); } catch (e) {}
      if (ok) return Promise.resolve(true);
      try { return navigator.clipboard.writeText(link).then(() => true, () => false); } catch (e) { return Promise.resolve(false); }
    };
    const done = ok => { if (ok) { hapOk(); toast('Ссылка скопирована — отправь её другу в Telegram'); } else toast('Не удалось скопировать. Ссылка: ' + INV[id], 10000); };
    if (INV[id]) return copy(INV[id]).then(done);
    return withBusy(el, async () => { await inviteLink(id); done(await copy(INV[id])); });
  },
  goal: () => go('goal', { id:CUR.p.id }),
  'goal-ex': el => { $('#g-text').value = el.dataset.t; hap(); },
  'ai-goal'(el){ withBusy(el, async () => {
    const text = $('#g-text').value.trim(); if (text.length < 3) return toast('Опиши цель словами');
    window._goal.text = text;
    const r = await api('aiGoal', { id:window._goal.id, text });
    if (!r.ai) { toast(r.error, 6000); return ACT['manual-goal'](); }
    hapOk(); goalForm(r.goal, r.explanation);
  }); },
  async 'manual-goal'(){
    const me = S.me || (cache.get('boot')||{}).me; const w = me ? Number(me.weight) : 70;
    try { const g = await api('saveGoal', { id:window._goal.id, goal_type:'lose', target_weight:Math.round((w-2)*2)/2, dry:true }); goalForm(g, ''); }
    catch (e) { goalForm({ goal_type:'nutrition', diet:'maintain', target_weight:'', targets:null, notes:[] }, ''); goalPreview(); }
  },
  async 'pick-diet'(){
    const v = await pickOption({ title:'Режим питания', value:window._goal.diet, options:Object.entries(DIET).map(([k,x]) => ({ v:k, t:x.t, d:x.d, i:x.i })) });
    if (!v) return; window._goal.diet = v; $('#g-di').textContent = DIET[v].i; $('#g-dn').textContent = DIET[v].t; goalPreview();
  },
  'save-goal'(el){ withBusy(el, async () => {
    const G = window._goal;
    const g = await api('saveGoal', { id:G.id, goal_type:segVal('g-type'), diet:G.diet, target_weight:numVal('g-w'), goal_text:G.text, explanation:G.expl });
    if (g.notes && g.notes.length) toast(g.notes[0]);
    cache.set('ch:'+G.id, null); S.bootP = null; hapOk(); HIST.pop(); go('challenge', { id:G.id }, { replace:true });
  }); },

  'save-weight'(el){ withBusy(el, async () => {
    const w = numVal('w-in'); if (w === '' || isNaN(w)) return toast('Укажи вес');
    const r = await api('log', { id:CUR.p.id, weight:w }); S.me = null; S.bootP = null; hapOk(); applyChallenge(r); toast(r.day ? r.day.verdict : 'Записано ✅', 5200);
  }); },
  'add-food': () => foodSheet(),
  'food-ex': el => { $('#f-text').value = el.dataset.t; hap(); },
  'food-manual'(){ $('#f-res').innerHTML = foodTotals(); $('#f-btns').style.display = 'none'; },
  'food-ai'(el){ withBusy(el, async () => {
    const text = $('#f-text').value.trim(); if (text.length < 2) return toast('Опиши, что ты ел');
    const r = await api('parseFood', { text });
    const tot = r.items.reduce((a,i) => ({ kcal:a.kcal+i.kcal, protein:a.protein+i.protein, fat:a.fat+i.fat, carbs:a.carbs+i.carbs }), { kcal:0, protein:0, fat:0, carbs:0 });
    ['protein','fat','carbs'].forEach(k => tot[k] = Math.round(tot[k]*10)/10);
    $('#f-res').innerHTML = `<div class="card" style="box-shadow:none;background:color-mix(in srgb,var(--accent) 7%,var(--card));margin-top:14px">
      <div class="row" style="margin-bottom:6px"><span style="font-size:20px">${r.searched?'🔎':'🧮'}</span><b>${r.searched?'Нашёл в интернете':'Оценка ИИ (без поиска)'}</b></div>
      ${r.items.map(i => `<div class="aiitem"><div class="row between"><b class="ell" style="max-width:68%">${esc(i.name)}</b><b>${i.kcal} ккал</b></div><div class="muted xs">${esc(i.amount)} · Б ${i.protein} · Ж ${i.fat} · У ${i.carbs}</div></div>`).join('')}
      ${r.note?`<p class="muted xs" style="margin-top:8px">${esc(r.note)}</p>`:''}
      ${r.warn && r.warn.length?`<p class="xs" style="color:var(--warn);margin-top:6px">⚠️ У «${esc(r.warn.join('», «'))}» калории не сходятся с БЖУ — проверь итог.</p>`:''}
      ${r.sources && r.sources.length?`<div class="src" style="margin-top:8px;display:flex;gap:10px;flex-wrap:wrap">${r.sources.map(s => `<a href="${esc(s.uri)}" target="_blank" rel="noopener">↗ ${esc(s.title)}</a>`).join('')}</div>`:''}</div>${foodTotals(tot)}`;
    $('#f-btns').style.display = 'none'; hapOk();
  }); },
  'food-save': el => saveFood(el),
  async 'del-food'(el){
    const id = CUR.p.id, fid = el.dataset.fid; el.closest('.food').style.opacity = .35; hap();
    try { const r = await api('delFood', { id, food_id:fid }); applyChallenge(r); toast(r.day ? r.day.verdict : 'Удалено', 4200); }
    catch (e) { el.closest('.food').style.opacity = 1; toast(e.message); }
  },

  'save-profile'(el){ withBusy(el, async () => {
    const me = await api('saveProfile', { height:numVal('p-h'), weight:numVal('p-w'), birth:$('#p-b').dataset.v, age:($('#p-b').dataset.v ? ageOf($('#p-b').dataset.v) : ''), sex:$('#p-s').dataset.v, activity:$('#p-act').dataset.value });
    S.me = me; S.bootP = null; const b = cache.get('boot'); if (b) { b.me = me; cache.set('boot', b); } hapOk();
    const back = el.dataset.back;
    if (back) { await api('join', { id:back }); cache.set('ch:'+back, null); HIST.pop(); return go('goal', { id:back }, { replace:true }); }
    toast('Профиль сохранён ✅'); renderProfile(me);
  }); },
  async 'toggle-remind'(el){
    const on = !el.classList.contains('on');
    if (on) {
      const ok = await new Promise(res => { try { tg.requestWriteAccess ? tg.requestWriteAccess(a => res(a !== false)) : res(true); } catch(e){ res(true); } });
      if (!ok) return toast('Без разрешения бот не сможет писать тебе. Разреши в окне Telegram');
    }
    try {
      const me = await api('saveSettings', { remind_hour: on ? (S.me && S.me.remind_hour != null ? S.me.remind_hour : 9) : null, can_dm: on });
      S.me = me; el.classList.toggle('on', on); $('#rem-more').style.display = on ? '' : 'none'; $('#rem-t').textContent = pad(me.remind_hour ?? 9)+':00'; hapOk();
      toast(on ? 'Готово! Напомню в '+pad(me.remind_hour ?? 9)+':00' : 'Напоминания выключены');
    } catch (e) { toast(e.message); }
  },
  async 'pick-hour'(el){
    const h = await pickHour(Number(el.dataset.h)); if (h == null) return;
    try { const me = await api('saveSettings', { remind_hour:h, can_dm:true }); S.me = me; el.dataset.h = h; $('#rem-t').textContent = pad(h)+':00'; toast('Буду напоминать в '+pad(h)+':00'); } catch (e) { toast(e.message); }
  },
  'test-push'(el){ withBusy(el, async () => { await api('testPush'); toast('Отправил — проверь чат с ботом 📨'); hapOk(); }); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) { e.preventDefault(); ACT[el.dataset.act](el, e); } });

/* ═════════ СТАРТ ═════════ */
(function start(){
  const sp = tg.initDataUnsafe && tg.initDataUnsafe.start_param;
  if (sp && /^[A-Za-z0-9_-]+$/.test(sp)) { CUR = { v:'home' }; go('challenge', { id:sp }); }
  else go('home', {}, { tab:true });
})();
</script>
</body>
</html>
